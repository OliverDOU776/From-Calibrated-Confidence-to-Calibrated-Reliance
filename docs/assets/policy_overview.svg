<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">The four confidence-display policies</title>
  <desc id="desc">Exact display curves for direct policy g0, global policy g1, and bounded policy g3, plus the training and application flow for the user-state-aware g2 policy.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #172554; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #64748b; }
      .math { font-family: Georgia, serif; font-size: 15px; font-style: italic; fill: #334155; }
      .axis { stroke: #475569; stroke-width: 2; fill: none; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 5; }
      .flow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="560" rx="26" fill="#f8fafc"/>
  <rect x="18" y="18" width="1244" height="524" rx="22" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="640" y="59" text-anchor="middle" class="title">Four ways to turn model confidence into a displayed score</text>

  <!-- Exact global curves -->
  <rect x="48" y="86" width="718" height="420" rx="18" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="407" y="119" text-anchor="middle" class="heading">Fixed policies · exact curves used by the code</text>

  <!-- plot grid: x 118..688, y 414..158 -->
  <line x1="118" y1="350" x2="688" y2="350" class="grid"/>
  <line x1="118" y1="286" x2="688" y2="286" class="grid"/>
  <line x1="118" y1="222" x2="688" y2="222" class="grid"/>
  <line x1="260.5" y1="158" x2="260.5" y2="414" class="grid"/>
  <line x1="403" y1="158" x2="403" y2="414" class="grid"/>
  <line x1="545.5" y1="158" x2="545.5" y2="414" class="grid"/>
  <path d="M118 158 L118 414 L688 414" class="axis"/>

  <text x="118" y="438" text-anchor="middle" class="small">0</text>
  <text x="260.5" y="438" text-anchor="middle" class="small">0.25</text>
  <text x="403" y="438" text-anchor="middle" class="small">0.50</text>
  <text x="545.5" y="438" text-anchor="middle" class="small">0.75</text>
  <text x="688" y="438" text-anchor="middle" class="small">1</text>
  <text x="403" y="472" text-anchor="middle" class="body">Model confidence c</text>

  <text x="101" y="419" text-anchor="end" class="small">0</text>
  <text x="101" y="355" text-anchor="end" class="small">0.25</text>
  <text x="101" y="291" text-anchor="end" class="small">0.50</text>
  <text x="101" y="227" text-anchor="end" class="small">0.75</text>
  <text x="101" y="163" text-anchor="end" class="small">1</text>
  <text x="71" y="286" text-anchor="middle" class="body" transform="rotate(-90 71 286)">Displayed score d</text>

  <!-- g0: y = c -->
  <path d="M118 414 L688 158" fill="none" stroke="#64748b" stroke-width="4"/>
  <!-- g1: clip(2.4c - 0.5, 0, 1); thresholds c=5/24 and c=5/8 -->
  <path d="M118 414 L236.75 414 L474.25 158 L688 158" fill="none" stroke="#2563eb" stroke-width="4"/>
  <!-- g3: clip(g1, .15, .85); transition c=13/48 to c=9/16 -->
  <path d="M118 375.6 L272.375 375.6 L438.625 196.4 L688 196.4" fill="none" stroke="#059669" stroke-width="4"/>

  <rect x="158" y="139" width="176" height="80" rx="12" fill="#ffffff" fill-opacity="0.96" stroke="#e2e8f0"/>
  <line x1="174" y1="161" x2="204" y2="161" stroke="#64748b" stroke-width="4"/>
  <text x="216" y="166" class="body">g0  ·  direct</text>
  <line x1="174" y1="185" x2="204" y2="185" stroke="#2563eb" stroke-width="4"/>
  <text x="216" y="190" class="body">g1  ·  global</text>
  <line x1="174" y1="209" x2="204" y2="209" stroke="#059669" stroke-width="4"/>
  <text x="216" y="214" class="body">g3  ·  bounded</text>

  <!-- g2 training/application flow -->
  <rect x="794" y="86" width="438" height="420" rx="18" fill="#ffffff" stroke="#d8b4fe" filter="url(#shadow)"/>
  <text x="1013" y="119" text-anchor="middle" class="heading">g2 · user-state-aware and data-fitted</text>

  <rect x="824" y="145" width="164" height="72" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="906" y="174" text-anchor="middle" class="body">Model confidence</text>
  <text x="906" y="198" text-anchor="middle" class="math">c</text>

  <rect x="1038" y="145" width="164" height="72" rx="12" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="1120" y="174" text-anchor="middle" class="body">Pre-advice state</text>
  <text x="1120" y="198" text-anchor="middle" class="math">u</text>

  <path d="M906 217 L906 248 L954 248" class="flow"/>
  <path d="M1120 217 L1120 248 L1072 248" class="flow"/>

  <rect x="842" y="251" width="342" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1013" y="279" text-anchor="middle" class="body">Training: assign low / mid / high by u</text>
  <text x="1013" y="303" text-anchor="middle" class="body">and fit one monotone c → outcome map</text>
  <text x="1013" y="327" text-anchor="middle" class="body">for each tercile</text>
  <text x="1013" y="345" text-anchor="middle" class="small">global fallback for sparse or missing groups</text>

  <path d="M1013 351 L1013 382" class="flow"/>
  <rect x="858" y="385" width="310" height="76" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1013" y="414" text-anchor="middle" class="body">Inference: select the fitted map for u</text>
  <text x="1013" y="443" text-anchor="middle" class="math">d = g2(c, u)</text>

  <text x="640" y="531" text-anchor="middle" class="small">g0, g1, and g3 are deterministic. g2 must be fitted on training data before it is applied to new interactions.</text>
</svg>
